name: Render Tagesausgabe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Datum aus engine/build.py lesen
        id: d
        run: |
          DATE=$(python3 -c "import re,io;print(re.search(r'DATE\s*=\s*\"([0-9-]+)\"', io.open('engine/build.py',encoding='utf-8').read()).group(1))")
          echo "Datum: $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Abhaengigkeiten
        run: |
          python3 -m pip install --quiet --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          python3 -c "import PIL; print('PIL', PIL.__version__)"

      - name: Schriften
        run: |
          mkdir -p fonts
          for w in Bold Medium Regular; do
            curl -sSL -o "fonts/Poppins-$w.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf"
          done
          ls -l fonts

      - name: Rendern
        env:
          FONTDIR: fonts
          OUTROOT: .
        run: python3 engine/build.py

      - name: Pruefen
        env:
          DATE: ${{ steps.d.outputs.date }}
        run: |
          shopt -s nullglob
          n=0
          for f in "assets/$DATE"/slot-*/reel.mp4; do
            n=$((n+1))
            printf '%s ' "$f"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"
            ffprobe -v error -select_streams v -show_entries stream=width,height,codec_name -of csv=p=0 "$f"
          done
          echo "Reels geprueft: $n"
          find "assets/$DATE" -type f -printf '%10s %p\n' | sort -k2

      - name: Commit
        env:
          DATE: ${{ steps.d.outputs.date }}
        run: |
          git checkout -- fonts || true
          git clean -fd fonts || true
          git config user.name "ki-kapital-engine"
          git config user.email "actions@users.noreply.github.com"
          git add "assets/$DATE"
          git commit -m "Produktion $DATE" || echo "nichts zu committen"
          git push
