name: Render Tagesausgabe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Datum aus engine/build.py lesen
        id: d
        run: |
          DATE=$(python3 -c "import re,io;print(re.search(r'DATE\s*=\s*\"([0-9-]+)\"', io.open('engine/build.py',encoding='utf-8').read()).group(1))")
          echo "Datum: $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Abhaengigkeiten
        timeout-minutes: 6
        run: |
          python3 -m pip install --quiet --upgrade pillow imageio-ffmpeg
          python3 -c "import PIL; print('PIL', PIL.__version__)"
          python3 -c "import imageio_ffmpeg as m; print('ffmpeg:', m.get_ffmpeg_exe())"
          command -v ffmpeg && ffmpeg -version | head -1 || echo "kein System-ffmpeg, imageio-ffmpeg wird benutzt"
          command -v ffprobe && ffprobe -version | head -1 || echo "kein ffprobe"

      - name: Schriften
        timeout-minutes: 4
        run: |
          mkdir -p fonts
          for w in Bold Medium Regular; do
            curl -sSL --retry 3 -o "fonts/Poppins-$w.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf"
          done
          ls -l fonts

      - name: Rendern
        timeout-minutes: 10
        env:
          FONTDIR: fonts
          OUTROOT: .
        run: python3 engine/build.py

      - name: Pruefen
        env:
          DATE: ${{ steps.d.outputs.date }}
        run: |
          shopt -s nullglob
          n=0
          if command -v ffprobe >/dev/null 2>&1; then
            for f in "assets/$DATE"/slot-*/reel.mp4; do
              n=$((n+1)); printf '%s ' "$f"
              ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"
              ffprobe -v error -select_streams v -show_entries stream=width,height,codec_name -of csv=p=0 "$f"
            done
          else
            FF=$(python3 -c "import imageio_ffmpeg as m; print(m.get_ffmpeg_exe())")
            for f in "assets/$DATE"/slot-*/reel.mp4; do
              n=$((n+1)); echo "== $f"
              "$FF" -hide_banner -i "$f" -f null - 2>&1 | grep -E "Duration|Stream #0" || true
            done
          fi
          echo "Reels geprueft: $n"
          find "assets/$DATE" -type f -printf '%10s %p\n' | sort -k2

      - name: Commit
        env:
          DATE: ${{ steps.d.outputs.date }}
        run: |
          git checkout -- fonts || true
          git clean -fd fonts || true
          git config user.name "ki-kapital-engine"
          git config user.email "actions@users.noreply.github.com"
          git add "assets/$DATE"
          git commit -m "Produktion $DATE" || echo "nichts zu committen"
          git push
