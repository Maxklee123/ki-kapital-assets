name: Render Tagesausgabe

on:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        run: |
          python3 -m pip install --quiet --upgrade pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          python3 -c "import PIL; print('PIL', PIL.__version__)"

      - name: Schriften
        run: |
          mkdir -p fonts
          for w in Bold Medium Regular; do
            curl -sSL -o "fonts/Poppins-$w.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf"
          done
          ls -l fonts

      - name: Rendern
        env:
          FONTDIR: fonts
          OUTROOT: .
        run: python3 engine/build.py

      - name: Pruefen
        run: |
          for s in 2 3 6; do
            printf 'slot-%s ' "$s"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "assets/2026-10-30/slot-$s/reel.mp4"
            ffprobe -v error -select_streams v -show_entries stream=width,height,codec_name -of csv=p=0 "assets/2026-10-30/slot-$s/reel.mp4"
          done
          find assets/2026-10-30 -type f -printf '%10s %p\n' | sort -k2

      - name: Commit
        run: |
          rm -rf fonts
          git config user.name "ki-kapital-engine"
          git config user.email "actions@users.noreply.github.com"
          git add assets/2026-10-30
          git commit -m "Produktion 2026-10-30" || echo "nichts zu committen"
          git push
